name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'lib.js'
      - 'bridge.js'
      - 'style.css'
      - 'icon-*.png'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy the web app into the Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html app.js lib.js bridge.js style.css icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: Build signed APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Voice.apk
          gh release create "apk-${{ github.run_number }}" Voice.apk --title "Voice app build ${{ github.run_number }}" --notes "Sideload Voice.apk on your phone."

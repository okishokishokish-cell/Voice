<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<title>Voice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <button id="switchBtn" class="chip" type="button" aria-label="Switch assistant">
      <span id="chipText">Choose assistant</span><span class="caret">▾</span>
    </button>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">⚙</button>
  </header>

  <main id="stage">
    <div id="transcript" aria-live="polite"></div>
    <div id="caption"></div>
  </main>

  <footer>
    <div id="status">Tap to talk</div>
    <button id="orb" class="idle" type="button" aria-label="Talk">
      <span class="ring"></span><span class="core"></span>
    </button>
    <form id="typeForm" autocomplete="off">
      <input id="typeInput" type="text" placeholder="Or type a message" enterkeyhint="send">
      <button type="submit" id="typeSend">Send</button>
    </form>
  </footer>
</div>

<div id="overlay" hidden>
  <button id="overlayBtn" type="button">Tap to start</button>
</div>
<div id="toast" role="status"></div>

<!-- Quick switcher -->
<div class="sheet" id="switchSheet" hidden>
  <div class="panel">
    <h2>Switch assistant</h2>
    <div class="field">
      <label for="swProvider">Provider</label>
      <select id="swProvider"></select>
    </div>
    <div class="field">
      <label for="swBase" id="swBaseLabel">Base URL</label>
      <input id="swBase" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://your-host/v1">
    </div>
    <div class="field">
      <label for="swModel">Model</label>
      <input id="swModel" list="modelList" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type or pick a model">
      <datalist id="modelList"></datalist>
    </div>
    <div class="row">
      <button id="btnRefreshModels" type="button" class="btn">Refresh model list</button>
      <button id="btnMore" type="button" class="btn ghost">All settings</button>
    </div>
    <div id="swStatus" class="note"></div>
    <button id="btnSwClose" type="button" class="btn primary wide">Done</button>
  </div>
</div>

<!-- Settings -->
<div class="sheet" id="settingsSheet" hidden>
  <div class="panel">
    <h2>Settings</h2>

    <h3>API keys</h3>
    <p class="note">Keys are saved only in this browser and sent only to the provider you choose. Use keys with a spending limit.</p>
    <div id="keysList"></div>
    <label class="check"><input type="checkbox" id="showKeys"> Show keys</label>

    <h3>Voice (spoken replies)</h3>
    <div class="field">
      <label for="ttsEngine">Voice engine</label>
      <select id="ttsEngine">
        <option value="browser">Phone's built-in voices</option>
        <option value="openai">OpenAI voices (uses your OpenAI key)</option>
        <option value="off">Off (text only)</option>
      </select>
    </div>
    <div class="field" data-for="browser">
      <label for="voiceSelect">Voice</label>
      <select id="voiceSelect"></select>
    </div>
    <div class="field" data-for="browser">
      <label for="rate">Speed <span id="rateVal"></span></label>
      <input id="rate" type="range" min="0.6" max="1.6" step="0.05">
    </div>
    <div class="field" data-for="openai">
      <label for="oaVoice">OpenAI voice</label>
      <select id="oaVoice"></select>
    </div>
    <div class="field" data-for="openai">
      <label for="oaModel">OpenAI speech model</label>
      <input id="oaModel" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <button id="btnTestVoice" type="button" class="btn">Test voice</button>

    <h3>Listening</h3>
    <div class="field">
      <label for="lang">Speech language (BCP-47)</label>
      <input id="lang" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="en-AU">
    </div>
    <label class="check"><input type="checkbox" id="optHandsFree"> Hands-free: keep listening after each reply</label>
    <label class="check"><input type="checkbox" id="optAutoStart"> Start listening as soon as the app opens from its icon or button</label>
    <label class="check"><input type="checkbox" id="optWake"> Keep the screen on while talking</label>
    <label class="check"><input type="checkbox" id="optTranscript"> Show the written conversation</label>

    <h3>Assistant instructions</h3>
    <div class="field">
      <textarea id="systemPrompt" rows="5"></textarea>
    </div>

    <h3>Data</h3>
    <div class="row">
      <button id="btnClearChat" type="button" class="btn">Clear conversation</button>
      <button id="btnResetAll" type="button" class="btn danger">Erase keys &amp; settings</button>
    </div>

    <button id="btnClose" type="button" class="btn primary wide">Done</button>
  </div>
</div>

<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>

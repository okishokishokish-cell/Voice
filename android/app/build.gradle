plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bean.voice'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bean.voice'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('voice.keystore')
            storePassword 'voiceapp'
            keyAlias 'voice'
            keyPassword 'voiceapp'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
